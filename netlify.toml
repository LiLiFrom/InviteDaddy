# ============================================================================
# InviteDaddy — Netlify configuration
# Invite Daddy Limited · Company Registration Number 759077 · Registered in Ireland
# ============================================================================
#
# Payment provider: Revolut Merchant (Hosted Checkout Page).
# The customer enters an amount, a serverless function creates a Revolut order,
# and the customer is redirected to checkout.revolut.com to pay.
# ============================================================================
[build]
  publish = "."

# ---------------------------------------------------------------------------
# Security headers — applied to every route
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(self)"
    # CSP notes:
    #  - connect-src allows the page's fetch() to reach our own Netlify function
    #    (that's 'self') — the function is what talks to Revolut server-side.
    #  - Redirect to checkout.revolut.com is a top-level navigation, allowed by
    #    default, but we also list it in form-action for safety.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://merchant.revolut.com https://checkout.revolut.com; frame-src https://checkout.revolut.com; form-action 'self' https://checkout.revolut.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

# ---------------------------------------------------------------------------
# Payment result pages — do not cache, do not index
# ---------------------------------------------------------------------------
[[headers]]
  for = "/payment-success/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/payment-failed/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# ---------------------------------------------------------------------------
# Static asset caching
# ---------------------------------------------------------------------------
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
